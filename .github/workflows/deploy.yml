name: Bangun dan terbitkan situs

on:
  push:
    branches: [main]
  # Setiap PR dibangun dan diperiksa, tetapi tidak diterbitkan.
  pull_request:
  workflow_dispatch:
  # Ambil perubahan terbaru dari repo penelitian setiap hari.
  schedule:
    - cron: "17 0 * * *"
  # Dapat dipicu dari repo penelitian setelah ada pembaruan.
  repository_dispatch:
    types: [sumber-diperbarui]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Ambil repo korpus tahap 1
        uses: actions/checkout@v6
        with:
          repository: FeliksMakarios/batak-toba-korpus
          path: sumber/batak-toba-korpus
          # Riwayat lengkap dibutuhkan untuk mendeteksi perubahan sejak halaman korpus terakhir ditinjau.
          fetch-depth: 0

      - name: Ambil repo anotasi UD tahap 2
        uses: actions/checkout@v6
        with:
          repository: FeliksMakarios/batak-toba-corpus-v2
          path: sumber/batak-toba-corpus-v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Salin berkas sumber
        run: >-
          python scripts/sync_sources.py
          --v2 sumber/batak-toba-corpus-v2
          --korpus sumber/batak-toba-korpus
          --docs docs

      - name: Bangun situs
        run: mkdocs build --strict

      - name: Periksa tautan internal
        run: python scripts/cek_tautan.py site

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
